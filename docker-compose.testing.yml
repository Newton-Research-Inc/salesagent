# Docker Compose configuration for testing with 3 separate sales agent instances
# Each instance runs on a different port and serves a specific tenant without authentication

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: adcp
      POSTGRES_USER: adcp_user
      POSTGRES_PASSWORD: secure_password_change_me
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    ports:
      - "9532:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adcp_user -d adcp"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ESPN Sales Agent (Port 9580)
  espn-agent:
    build: .
    environment:
      DATABASE_URL: postgresql://adcp_user:secure_password_change_me@postgres:5432/adcp?sslmode=disable
      ADCP_TESTING: "true"
      ADCP_TEST_TENANT_ID: "espn"
      ADCP_TEST_PRINCIPAL_ID: "nike"
      ADCP_SALES_PORT: "8080"
      SKIP_NGINX: "true"
      GEMINI_API_KEY: "placeholder-for-testing"
      SUPER_ADMIN_EMAILS: "admin@test.com"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9580:8080"
    command: python scripts/run_server.py
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # CNN Sales Agent (Port 9581)
  cnn-agent:
    build: .
    environment:
      DATABASE_URL: postgresql://adcp_user:secure_password_change_me@postgres:5432/adcp?sslmode=disable
      ADCP_TESTING: "true"
      ADCP_TEST_TENANT_ID: "cnn"
      ADCP_TEST_PRINCIPAL_ID: "cocacola"
      ADCP_SALES_PORT: "8080"
      SKIP_NGINX: "true"
      GEMINI_API_KEY: "placeholder-for-testing"
      SUPER_ADMIN_EMAILS: "admin@test.com"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9581:8080"
    command: python scripts/run_server.py
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # NYT Sales Agent (Port 9582)
  nyt-agent:
    build: .
    environment:
      DATABASE_URL: postgresql://adcp_user:secure_password_change_me@postgres:5432/adcp?sslmode=disable
      ADCP_TESTING: "true"
      ADCP_TEST_TENANT_ID: "nyt"
      ADCP_TEST_PRINCIPAL_ID: "apple"
      ADCP_SALES_PORT: "8080"
      SKIP_NGINX: "true"
      GEMINI_API_KEY: "placeholder-for-testing"
      SUPER_ADMIN_EMAILS: "admin@test.com"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9582:8080"
    command: python scripts/run_server.py
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_test_data:

